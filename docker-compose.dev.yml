services:
  server:
    image: voc_server
    container_name: voc_server
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: server
    env_file:
      - ./packages/server/.env.development
    restart: no
    ports:
      - 5174:5174
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: curl --fail http://localhost:5174/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  client:
    image: voc_client
    container_name: voc_client
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: client
    restart: no
    depends_on:
      server:
        condition: service_healthy
    ports:
      - 5173:5173
    volumes:
      - .:/app
      - /app/node_modules
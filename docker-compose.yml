services:
  server:
    image: voc_server
    container_name: voc_server
    build:
      dockerfile: docker/Dockerfile
      target: server
    restart: unless-stopped
    env_file:
      - ./packages/server/.env
    ports:
      - 5174:5174
    healthcheck:
      test: curl --fail http://localhost:5174/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  client:
    image: voc_client
    container_name: voc_client
    build:
      dockerfile: docker/Dockerfile
      target: client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - 5173:80